<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NukeMap clone by Lazar Popovic</title>
    <link rel="stylesheet" href="src/css/styles.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="src/js/script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <main>
        <div id="map"></div>
      </main>
      <aside class="sidemenu">
        <div class="title__container">
          <h1 class="title">NukeMap</h1>
          <p class="title__text">clone by Lazar Popovic</p>
        </div>
        <hr />
        <div class="location__container">
          <div class="subtitle__container">
            <p>
              1.<span class="bold__text">Drag</span> the marker to wherever
              you'd like to target.
            </p>
          </div>
          <select name="locations" class="location__options">
            <option value="">Or you can select a preset...</option>
            <option value="washington">Washington, DC, USA</option>
            <option value="new_york">New York, NY, USA</option>
            <option value="boston">Boston, MA, USA</option>
            <option value="los_angeles">Los Angeles, CA, USA</option>
            <option value="chicago">Chicago, IL, USA</option>
            <option value="philadelphia">Philadelphia, PA, USA</option>
            <option value="honolulu">Honolulu, HI, USA</option>
            <option value="moscow">Moscow, Russia</option>
            <option value="london">London, England</option>
            <option value="paris">Paris, France</option>
            <option value="berlin">Berlin, Germany</option>
            <option value="beijing">Bejing, China</option>
            <option value="new_delhi">New Delhi, India</option>
            <option value="islamabad">Islamabad, Pakistan</option>
            <option value="tokyo">Tokyo, Japan</option>
            <option value="pyongyang">Pyongyang, North Korea</option>
            <option value="seoul">Seoul, South Korea</option>
            <option value="teheran">Teheran, Iran</option>
            <option value="tel_aviv">Tel Aviv, Isreal</option>
            <option disabled>Historical locations:</option>
            <option value="trinity">Trinity site, NM, USA (1945)</option>
            <option value="hiroshima">Hiroshima, Japan (1945)</option>
            <option value="nagasaki">Nagasaki, Japan (1945)</option>
            <option value="elugelab">
              Elugelab, Enewetak, Marshall Islands
            </option>
            <option value="namu">
              Namu Island, Bikini Atoll, Marshall Islands (1945)
            </option>
            <option value="sedan">
              Sedan Crater, Nevada Test Site, NV, USA (1962)
            </option>
            <option value="tsar">
              Tsar Bomba site, Novaya Zemlya, Russia (1961)
            </option>
          </select>
        </div>
        <hr />
        <div class="warhead__container">
          <div class="subtitle__container">
            <p>2.<span class="bold__text">Choose a warhead yeild: </span></p>
            <input type="text" class="warhead__input" name="warhead" />
            <p>kilotons</p>
          </div>
          <select name="bombs" class="warhead__options">
            <option value="">Or you can select a preset...</option>
            <option value="Davy">
              "Davy Crockett" - smallest US bomb produced (20 t)
            </option>
            <option value="Crude">
              Crude nuclear terrorist weapon (100 t)
            </option>
            <option value="B-61">
              B-61 Mod 3 (lowest kt currently in US arsenal) (300t)
            </option>
            <option value="NK06">
              North Krean weapon tested in 2006 (300 t)
            </option>
            <option value="NK09">
              North Krean weapon tested in 2009 (6 kt)
            </option>
            <option value="NK13">
              North Krean weapon tested in 2013 (10 kt)
            </option>
            <option value="HEU">
              Improvised HEU device - nuclear terrorism (10 kt)
            </option>
            <option value="little">
              "Little Boy" - Hiroshima bomb (15 kt)
            </option>
            <option value="gadget">"Gadget" - Trinity test (20 kt)</option>
            <option value="fat">"Fat Man" - Nagasaki bomb (20 kt)</option>
            <option value="pakistani">
              Largest Pakistani weapon tested (45 kt)
            </option>
            <option value="indian">Largest Indian weapon tested (60 kt)</option>
            <option value="W-76">
              W-76 (common in US & UK SLBM arsenal) (100 kt)
            </option>
            <option value="NK17">
              North Korean weapon tested in 2017 (150 kt?)
            </option>
            <option value="W-80">
              W-80 (currently in US arsenal, cruise missile) (150 kt)
            </option>
            <option value="W-87">
              W-87 (currently in US arsenal, Minuteman III) (300 kt)
            </option>
            <option value="TN">
              TN 80/81 (largest current French warhead) (300 kt)
            </option>
            <option value="B-61mod">
              B-61 Mod 7 (currently in US arsenal) (340 kt)
            </option>
            <option value="W-78">
              W-78 (currently in US arsenal, Minuteman III) (350 kt)
            </option>
            <option value="W-88">W-88 (Trident D5 warhead) (455 kt)</option>
            <option value="king">
              "Ivy King" - largest pure fission weapon tested by USA (500 kt)
            </option>
            <option value="topol">
              Topol (SS-25) (currently in Russian arsenal) (800 kt)
            </option>
            <option value="W-59">W-59 (Minuteman I warhead) (1 Mt)</option>
            <option value="B-83">
              B-83 (largest bomb in current US arsenal) (1.2 Mt)
            </option>
            <option value="R-12">
              R-12 (SS-4) Soviet missile, Cuban missile crisis (2.42 Mt)
            </option>
            <option value="dong4">
              Dong Feng-4, China's first deployed ICBM (3.3 Mt)
            </option>
            <option value="W-39">
              W-39, US H-bomb, almost accidentally detonated in 1961 (4 Mt)
            </option>
            <option value="dong5">
              Dong Feng-5, China's current ICBMs (5 Mt)
            </option>
            <option value="W-53">
              "W-53 (Titan II warhead, highest kt ICBM US deployed) (9 Mt)
            </option>
            <option value="mike">"Ivy Mike" - first H-bomb (10.4 Mt)</option>
            <option value="bravo">
              "Castle Bravo" - largest US bomb tested (15 Mt)
            </option>
            <option value="tsar1">
              "Tsar Bomba" - largest USSR bomb tested (50 Mt)
            </option>
            <option value="tsar2">
              "Tsar Bomba" - largest USSR bomb designed (100 Mt)
            </option>
          </select>
        </div>
        <hr />
        <div class="burst__container">
          <div class="subtitle__container">
            <p>
              3.<span class="bold__text">Options: </span><i>Height of burst:</i>
            </p>
          </div>
          <div class="radio__container">
            <div class="radio__wrap">
              <input
                type="radio"
                class="burst__radio"
                name="airburst"
                value="airburst"
              />
              <span>Airburst</span>
            </div>
            <div class="radio__wrap">
              <input
                type="radio"
                class="burst__radio"
                name="surface"
                value="surface"
              />
              <span>Surface</span>
            </div>
          </div>
        </div>
        <hr />
      </aside>
    </div>
  </body>
</html>
